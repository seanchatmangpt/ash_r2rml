[project]
name = "ash-r2rml-production"
version = "0.2.0"
description = "Deterministic production engineering projections from an admitted AshR2RML subject"
authors = ["ash_r2rml contributors"]
license = "MIT"
repository = "https://github.com/seanchatmangpt/ash_r2rml"

[ontology]
source = "input.ttl"
imports = ["vocabulary.ttl"]
base_iri = "https://w3id.org/ash-r2rml/production#"

[validation]
gates = [
  "gates/010_semantic_subject.rq",
  "gates/020_no_ambient_do.rq",
  "gates/030_candidate_identity.rq",
  "gates/040_admission_receipt.rq",
  "gates/050_alive_requires_alive_capabilities.rq",
  "gates/060_candidate_projection_closure.rq",
]
strict_mode = true

[generation]
output_dir = "output"
max_sparql_timeout_ms = 5000
require_audit_trail = true
determinism_salt = "ash-r2rml-production-v2"
enable_llm = false

[[generation.rules]]
name = "candidate-contracts"
query = { file = "queries/candidates.rq" }
template = { file = "templates/candidate-contract.md.tmpl" }
output_file = "generated/production/candidates/{{ sha }}/contract.md"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "capability-matrix"
query = { file = "queries/capabilities.rq" }
template = { file = "templates/capability-matrix.md.tmpl" }
output_file = "generated/production/capabilities/{{ capability }}/standing.md"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "kubernetes-candidate"
query = { file = "queries/operational-candidates.rq" }
template = { file = "templates/kubernetes-candidate.yaml.tmpl" }
output_file = "generated/production/candidates/{{ sha }}/kubernetes.yaml"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "release-plan"
query = { file = "queries/operational-candidates.rq" }
template = { file = "templates/release-plan.md.tmpl" }
output_file = "generated/production/candidates/{{ sha }}/release-plan.md"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "observability-contract"
query = { file = "queries/operational-candidates.rq" }
template = { file = "templates/otel-contract.yaml.tmpl" }
output_file = "generated/production/candidates/{{ sha }}/otel-contract.yaml"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "authority-policy"
query = { file = "queries/operational-candidates.rq" }
template = { file = "templates/brce-authority.rego.tmpl" }
output_file = "generated/production/candidates/{{ sha }}/brce-authority.rego"
skip_empty = true
mode = "Overwrite"

[[generation.rules]]
name = "evidence-standing"
query = { file = "queries/production-admission.rq" }
template = { file = "templates/evidence-standing.md.tmpl" }
output_file = "generated/production/evidence/standing.md"
skip_empty = true
mode = "Overwrite"
