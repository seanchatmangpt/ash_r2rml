# Ephemeral live-engine infrastructure for the repository verification ladder.
# These services are test subjects only; AshR2RML does not own persistence.
#
# neo4j-bolt5 -> bolt://localhost:7687
# neo4j-bolt6 -> bolt://localhost:7689
# neo4j-apoc  -> bolt://localhost:7691
# xaas-db-1   -> PostgreSQL/PostGIS used by the live Ontop adversarial crown.
services:
  neo4j-bolt5:
    image: neo4j:5.26.27
    container_name: neo4j-ash-bolt5
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [xaas]

  neo4j-bolt6:
    image: neo4j:2026.05.0-community-ubi10
    container_name: neo4j-ash-bolt6
    ports:
      - "7689:7687"
      - "7475:7474"
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [xaas]

  neo4j-apoc:
    image: neo4j:5.26.27
    container_name: neo4j-ash-apoc
    ports:
      - "7691:7687"
      - "7476:7474"
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN apoc.version()' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [xaas]

  xaas-db:
    image: postgis/postgis:16-3.4
    container_name: xaas-db-1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [xaas]

networks:
  xaas:
    name: xaas_default
