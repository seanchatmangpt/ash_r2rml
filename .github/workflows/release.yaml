name: Release to Hex

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish exact admitted tag to Hex.pm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag subject
        uses: actions/checkout@v4

      - name: Set up repository Elixir / Erlang toolchain
        uses: jdx/mise-action@v2

      - name: Refuse tag/version identity mismatch
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -n 1)"
          test -n "${project_version}"
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Resolve dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get

      - name: Compile exact release subject
        run: mix compile --force --warnings-as-errors

      - name: Build Hex package
        run: mix hex.build

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        if: env.HEX_API_KEY != ''
        run: mix hex.publish --yes
