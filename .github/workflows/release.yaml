name: Release to Hex

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact admitted tag to Hex.pm
    runs-on: ubuntu-latest
    steps:
      - name: Require green CI check runs for tagged SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Required check names are matched exactly (one per line). A name that is absent
          # is treated as not-yet-started and polled until the epoch deadline, same as a
          # queued/in_progress run. After the poll, per name: at least one run, and every
          # run completed with success. Anything missing or pending at the deadline fails.
          names='test
          test-postgres
          types
          release-security (ci)
          release-security (exact-head court)'
          deadline=$(( $(date +%s) + 1200 ))
          while :; do
            runs="$(gh api --paginate "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "none")] | @tsv')"
            pending=0
            while IFS= read -r name; do
              name="${name#"${name%%[![:space:]]*}"}"
              [ -n "${name}" ] || continue
              rows="$(printf '%s\n' "${runs}" | awk -F'\t' -v n="${name}" '$1 == n')"
              if [ -z "${rows}" ]; then
                echo "Not yet present: ${name}"
                pending=1
              elif printf '%s\n' "${rows}" | awk -F'\t' '$2 != "completed" { p=1 } END { exit !p }'; then
                echo "Not yet completed: ${name}"
                pending=1
              fi
            done <<< "${names}"
            if [ "${pending}" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error title=CI gate::required check runs absent or incomplete after 20 min for ${{ github.sha }}"
              exit 1
            fi
            echo "Waiting for required check runs..."
            sleep 15
          done
          fail=0
          while IFS= read -r name; do
            name="${name#"${name%%[![:space:]]*}"}"
            [ -n "${name}" ] || continue
            rows="$(printf '%s\n' "${runs}" | awk -F'\t' -v n="${name}" '$1 == n')"
            if [ -z "${rows}" ]; then
              echo "::error title=CI gate::no check run named '${name}' for ${{ github.sha }}"
              fail=1
            elif printf '%s\n' "${rows}" | awk -F'\t' '$3 != "success" { bad=1 } END { exit !bad }'; then
              echo "::error title=CI gate::check run '${name}' has a non-success run for ${{ github.sha }}: $(printf '%s' "${rows}" | tr '\t\n' ' ;')"
              fail=1
            fi
          done <<< "${names}"
          exit "${fail}"

      - name: Checkout exact tag subject
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact tag subject identity
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Refuse tag commit not on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - name: Set up repository Elixir / Erlang toolchain
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Refuse tag/version identity mismatch
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -n 1)"
          test -n "${project_version}"
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Resolve dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get

      - name: Compile exact release subject
        run: mix compile --force --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

      - name: Build Hex package
        run: mix hex.build

      - name: Fail when HEX_API_KEY is absent
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        if: env.HEX_API_KEY == ''
        run: |
          echo "::error title=Hex publish blocked::HEX_API_KEY is empty; package was built but NOT published"
          exit 1

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        if: env.HEX_API_KEY != ''
        run: mix hex.publish --yes
