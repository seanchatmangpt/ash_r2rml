name: Release to Hex

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish exact admitted tag to Hex.pm
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout admitted subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        uses: ./.github/actions/assert-exact-head
        with:
          subject_sha: ${{ github.sha }}

      - name: Setup Elixir (clean resolve)
        uses: ./.github/actions/setup-elixir
        with:
          clean: "true"

      - name: Refuse tag/version identity mismatch
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -n 1)"
          test -n "${project_version}"
          test "${GITHUB_REF_NAME}" = "v${project_version}"

      - name: Compile exact release subject
        run: mix compile --force --warnings-as-errors

      - name: Build Hex package
        run: mix hex.build

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        if: ${{ env.HEX_API_KEY != '' }}
        run: mix hex.publish --yes
