name: R84 Ash Reactor Domain Error Fanout

on:
  pull_request:
    paths:
      - "test/negative/r84_domain_error_contract_test.exs"
      - ".github/workflows/r84-domain-error-fanout.yml"
      - ".github/actions/**"
      - "lib/ash_r2rml/reactor/**"
      - "lib/ash_r2rml/compiler.ex"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r84-domain-error-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  r84-consumer-court:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout admitted subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        uses: ./.github/actions/assert-exact-head
        with:
          subject_sha: ${{ env.SUBJECT_SHA }}

      - name: Setup Elixir (clean resolve)
        uses: ./.github/actions/setup-elixir
        with:
          clean: "true"

      - name: Compile warnings-as-errors
        run: mix compile --force --warnings-as-errors

      - name: Execute R84 typed-refusal consumer court
        run: mix test test/negative/r84_domain_error_contract_test.exs
