name: CI

on: [push, pull_request]

# Two gates: `types` is database-free — `mix compile --warnings-as-errors` runs
# Elixir 1.20's set-theoretic type checker and `mix dialyzer` adds success
# typing. `test` runs the full suite against the three Neo4j servers from the
# bundled docker-compose.yml (bolt5 5.26.27 → 7687, bolt6 2026.05 → 7689,
# apoc 5.26.27 → 7691), matching the Bolt / Bolt6 / BoltApoc blocks in
# config/test.exs.
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v2

      - name: Cache deps and build (incl. Dialyzer PLT)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (1.20 type checker + warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Dialyzer
        run: mix dialyzer

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v2

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Start Neo4j test databases (bolt5 → 7687, bolt6 → 7689, apoc → 7691)
        run: docker compose up -d --wait --wait-timeout 300

      - name: Test (default + cypher25 + bolt6 + apoc + slow)
        run: mix test --include cypher25 --include bolt6 --include apoc --include slow

      - name: Stop Neo4j test databases
        if: always()
        run: docker compose down
