name: CI

on: [push, pull_request]

# Three gates:
# - `types` is database-free: compile warnings-as-errors + Dialyzer.
# - `test` preserves the full inherited Neo4j control suite.
# - `obda` executes the bounded ontology-first crown against real PostgreSQL,
#   official Ontop, and the Neo4j control graph. Technical parity still does
#   not grant cutover authority.
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v2

      - name: Cache deps and build (incl. Dialyzer PLT)
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile (1.20 type checker + warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Dialyzer
        run: mix dialyzer

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v2

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Start Neo4j test databases (bolt5 → 7687, bolt6 → 7689, apoc → 7691)
        run: docker compose up -d --wait --wait-timeout 300

      - name: Test (default + cypher25 + bolt6 + apoc + slow)
        run: mix test --include cypher25 --include bolt6 --include apoc --include slow

      - name: Stop Neo4j test databases
        if: always()
        run: docker compose down

  obda:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_r2ml
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ash_r2ml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v2

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile candidate compiler
        run: mix compile --force --warnings-as-errors

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Start Neo4j control database
        run: docker compose up -d --wait --wait-timeout 300 neo4j-bolt5

      - name: Pull pinned official Ontop image
        run: docker pull ontop/ontop:5.5.0

      - name: Execute RDF/SHACL → Postgres/R2RML → Ontop + Neo4j parity crown
        env:
          MIX_ENV: test
        run: mix run test/integration/obda_crown.exs

      - name: Publish bounded parity receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ash-r2ml-obda-parity
          path: tmp/ash_r2ml_obda/parity-receipt.json
          if-no-files-found: ignore

      - name: Stop Neo4j control database
        if: always()
        run: docker compose down
