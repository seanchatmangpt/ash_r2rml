name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Four evidence gates:
# - `types` is database-free: clean dependency resolution, format, compile warnings-as-errors,
#   Dialyzer, and exact-candidate Hex package construction.
# - `release-security` is the AshR2RML package/release gate: deterministic dependency lock,
#   formatting, compile, database-free suite (including the real AshCloak R2RML-109
#   regression), and Hex build.
# - `test` executes the complete live-engine suite, including the adversarial Ontop/PostgreSQL command.
# - `obda` runs the Ash-first parity crown and the Ontop 5.5.0 compliance crown against PostGIS.
#
# PR jobs explicitly checkout the PR head SHA rather than GitHub's synthetic merge ref,
# binding receipts to the exact candidate. `deps/` and `_build/` are never cached: Rebar
# artifacts are toolchain-sensitive and stale restoration can manufacture false evidence.
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Resolve dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Dialyzer
        run: mix dialyzer

      - name: Build exact release-candidate Hex package
        run: mix hex.build

  release-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Cache exact-toolchain deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Verify dependency lock is deterministic
        run: git diff --exit-code -- mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile candidate with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Execute database-free release suite
        run: mix test --exclude external

      - name: Build Hex package
        run: mix hex.build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Resolve dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get

      - name: Supply PostgreSQL JDBC driver for live adversarial Ontop test
        env:
          PGJDBC_VERSION: "42.7.4"
        run: |
          set -euo pipefail
          jdbc_dir="priv/ontop/jdbc"
          jdbc_jar="${jdbc_dir}/postgresql-${PGJDBC_VERSION}.jar"
          mkdir -p "${jdbc_dir}"
          curl --fail --location --silent --show-error \
            "https://repo1.maven.org/maven2/org/postgresql/postgresql/${PGJDBC_VERSION}/postgresql-${PGJDBC_VERSION}.jar" \
            --output "${jdbc_jar}"
          expected_sha1="$(curl --fail --location --silent --show-error "https://repo1.maven.org/maven2/org/postgresql/postgresql/${PGJDBC_VERSION}/postgresql-${PGJDBC_VERSION}.jar.sha1")"
          echo "${expected_sha1}  ${jdbc_jar}" | sha1sum --check --strict

      - name: Start complete live verification topology
        run: docker compose up -d --wait --wait-timeout 300

      - name: Test complete live suite
        env:
          NEO4J_ENABLED: "true"
          POSTGRES_PASSWORD: postgres
        run: mix test --include cypher25 --include bolt6 --include apoc --include slow

      - name: Stop live verification topology
        if: always()
        run: docker compose down -v

  obda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Resolve dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get

      - name: Compile candidate
        run: MIX_ENV=test mix compile --force --warnings-as-errors

      - name: Supply pinned PostgreSQL JDBC driver to Ontop
        env:
          PGJDBC_SHA256: "188976721ead8e8627eb6d8389d500dccc0c9bebd885268a3047180274a6031e"
        run: |
          set -euo pipefail
          mkdir -p priv/ontop/jdbc
          jar=priv/ontop/jdbc/postgresql-42.7.4.jar
          curl --fail --location --silent --show-error \
            "https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.4/postgresql-42.7.4.jar" \
            --output "${jar}"
          echo "${PGJDBC_SHA256}  ${jar}" | sha256sum --check --strict

      - name: Start PostgreSQL (PostGIS) and pull pinned Ontop image
        run: |
          docker compose up -d --wait --wait-timeout 300 xaas-db
          docker pull ontop/ontop:5.5.0

      - name: Execute Ash-first OBDA parity crown (Ash + Ontop CLI + Ontop endpoint == PostgreSQL)
        env:
          MIX_ENV: test
          POSTGRES_PASSWORD: postgres
        run: mix run test/integration/obda_crown.exs

      - name: Execute Ontop 5.5.0 SPARQL + GeoSPARQL compliance crown
        env:
          MIX_ENV: test
          POSTGRES_PASSWORD: postgres
        run: mix run test/integration/ontop_compliance_crown.exs

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
