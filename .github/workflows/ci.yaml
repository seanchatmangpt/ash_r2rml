name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Three evidence gates:
# - `types` is database-free: clean dependency resolution, format, compile warnings-as-errors,
#   Dialyzer, and exact-candidate Hex package construction.
# - `release-security` is the AshR2RML package/release gate: deterministic dependency lock,
#   formatting, compile, database-free suite (including the real AshCloak R2RML-109
#   regression), and Hex build.
# - `test` executes the complete suite against ETS and file-backed AshSqlite.
# - `test-postgres` runs the same contract against a PostgreSQL 16 service container.
#
# PR jobs explicitly checkout the PR head SHA rather than GitHub's synthetic merge ref,
# binding receipts to the exact candidate. `deps/` and `_build/` are never cached: Rebar
# artifacts are toolchain-sensitive and stale restoration can manufacture false evidence.
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Resolve dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --force --warnings-as-errors

      - name: Dialyzer
        run: mix dialyzer

      - name: Build exact release-candidate Hex package
        run: mix hex.build

  release-security:
    name: release-security (ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Cache exact-toolchain deps and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('.tool-versions') }}-${{ hashFiles('**/mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Verify dependency lock is deterministic
        run: git diff --exit-code -- mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile candidate with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Execute database-free release suite
        run: mix test

      - name: Build Hex package
        run: mix hex.build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Resolve dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get

      - name: Test complete suite (ETS + file-backed AshSqlite)
        run: mix test --include sqlite --warnings-as-errors

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ash_r2rml_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ASH_R2RML_POSTGRES_URL: ecto://postgres:postgres@localhost:5432/ash_r2rml_contract
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Elixir / Erlang (from .tool-versions)
        uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d

      - name: Resolve dependencies from clean state
        run: |
          set -euo pipefail
          rm -rf deps _build
          mix deps.get

      - name: Postgres contract tier (AshPostgres, zero skips)
        run: mix test --include sqlite --include postgres --warnings-as-errors
