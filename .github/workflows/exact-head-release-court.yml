name: Exact-head release court

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ash-r2rml-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  release-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        uses: ./.github/actions/assert-exact-head
        with:
          subject_sha: ${{ env.SUBJECT_SHA }}

      - name: Setup Elixir (clean resolve + lock verify)
        uses: ./.github/actions/setup-elixir
        with:
          clean: "true"
          verify_lock: "true"

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile candidate with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Execute database-free release suite
        run: mix test --exclude external

      - name: Construct exact candidate Hex package without publication
        run: mix hex.build

      - name: Manufacture bounded release receipt
        if: always()
        run: |
          set -euo pipefail
          mkdir -p receipt
          actual="$(git rev-parse HEAD)"
          package="$(find . -maxdepth 1 -type f -name '*.tar' -printf '%f\n' | sort | head -n1 || true)"
          cat > receipt/release-court.json <<JSON
          {
            "subject_sha": "$actual",
            "court": "lock+format+compile+database_free_tests+hex_build",
            "package": "$package",
            "publication": "not_attempted",
            "merge": "not_attempted",
            "runtime_execution": "not_claimed",
            "standing": "candidate_evidence_only"
          }
          JSON
          python3 -m json.tool receipt/release-court.json

      - name: Preserve bounded release receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ash-r2rml-release-${{ env.SUBJECT_SHA }}
          path: |
            receipt/release-court.json
            *.tar
          if-no-files-found: warn
          retention-days: 14
