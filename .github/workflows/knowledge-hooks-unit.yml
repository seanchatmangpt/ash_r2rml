name: Knowledge Hooks Unit

on:
  push:
    branches: [main]
    paths: &knowledge-hooks-paths
      - "lib/ash_r2rml.ex"
      - "lib/ash_r2rml/semantic_web.ex"
      - "lib/ash_r2rml/knowledge_hooks.ex"
      - "lib/ash_r2rml/knowledge_hook/**"
      - "lib/ash_r2rml/ggen/knowledge_hooks.ex"
      - "lib/ash_r2rml/frontier_evidence.ex"
      - "priv/ontology/knowledge-hooks.ttl"
      - "priv/shapes/knowledge-hooks.shacl.ttl"
      - "test/knowledge_hooks_test.exs"
      - "test/knowledge_hook_ash_test.exs"
      - "test/knowledge_hook_spec_test.exs"
      - "test/knowledge_hook_promotion_test.exs"
      - "test/knowledge_hook_vocabulary_test.exs"
      - "test/knowledge_hook_rdf_test.exs"
      - "test/frontier_evidence_test.exs"
      - "test/frontier_evidence_identity_test.exs"
      - "test/adversarial/knowledge_hooks_authority_test.exs"
      - "test/adversarial/knowledge_hooks_actuation_chicago_test.exs"
      - "lib/ash_r2rml/knowledge_hook/actuator.ex"
      - ".github/workflows/knowledge-hooks-unit.yml"
      - ".github/actions/**"
  pull_request:
    paths: *knowledge-hooks-paths

concurrency:
  group: knowledge-hooks-unit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  knowledge-hooks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout admitted subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        uses: ./.github/actions/assert-exact-head
        with:
          subject_sha: ${{ env.SUBJECT_SHA }}

      - name: Setup Elixir (clean resolve)
        uses: ./.github/actions/setup-elixir
        with:
          clean: "true"

      - name: Check FrontierEvidence formatting
        run: >-
          mix format --check-formatted
          lib/ash_r2rml/frontier_evidence.ex
          test/frontier_evidence_test.exs
          test/frontier_evidence_identity_test.exs

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Execute knowledge-hook contract and authority falsifiers
        run: >-
          mix test
          test/knowledge_hooks_test.exs
          test/knowledge_hook_ash_test.exs
          test/knowledge_hook_spec_test.exs
          test/knowledge_hook_promotion_test.exs
          test/knowledge_hook_vocabulary_test.exs
          test/knowledge_hook_rdf_test.exs
          test/frontier_evidence_test.exs
          test/frontier_evidence_identity_test.exs
          test/adversarial/knowledge_hooks_authority_test.exs
          test/adversarial/knowledge_hooks_actuation_chicago_test.exs
