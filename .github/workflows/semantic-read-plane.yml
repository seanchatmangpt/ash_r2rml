name: Semantic Read Plane

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: semantic-read-plane-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Database-free verifier for the canonical external semantic read plane.
# This exists independently of the inherited Neo4j/OBDA integration topology:
# schema manufacture, no-write invariants, customization refusal, and sibling
# projection replay do not require a database to prove.
jobs:
  graphql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout admitted subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SUBJECT_SHA }}
          persist-credentials: false

      - name: Assert exact subject identity
        uses: ./.github/actions/assert-exact-head
        with:
          subject_sha: ${{ env.SUBJECT_SHA }}

      - name: Setup Elixir (clean resolve)
        uses: ./.github/actions/setup-elixir
        with:
          clean: "true"

      - name: Compile with warnings as errors
        run: mix compile --force --warnings-as-errors

      - name: Verify canonical GraphQL projection and DfCM boundary
        run: mix test test/ggen_api_bundle_test.exs test/semantic_graphql_dfcm_test.exs --trace
